[package]
name = "panda"
description = "Panda v2 music bot, built only on the public Bot SDK"
version = "2.0.0-alpha.1"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "panda"
path = "src/lib.rs"

[[bin]]
name = "panda"
path = "src/main.rs"

[dependencies]
# Dogfooding (§4.5): Panda talks to Era only through the public SDK.
era-bot-sdk = { workspace = true, features = ["voice"] }

log.workspace = true
env_logger.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "signal", "net"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
