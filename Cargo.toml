# Generated by the Evre monorepo's tools/panda-oss/export.py: edit the
# sources there, not here (see CONTRIBUTING in README.md).
[workspace]
resolver = "3"
members = ["panda", "bot-sdk", "protocol", "entitlements"]
# Upstream crates with small patches (vendor/README.md), not members.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KaanBahaSever/evre-panda"

[workspace.dependencies]
anyhow = "1"
bitflags = "2.13"
clap = { version = "4.5", features = ["derive"] }
entitlements = { path = "entitlements" }
env_logger = "0.11"
era-bot-sdk = { path = "bot-sdk" }
futures = "0.3"
livekit = { version = "=0.9.6", features = ["rustls-tls-native-roots"] }
log = "0.4"
protocol = { path = "protocol" }
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = "0.29"
url = "2.5"

[patch.crates-io]
livekit = { path = "vendor/livekit" }
webrtc-sys = { path = "vendor/webrtc-sys" }

[profile.release]
# Smaller binaries for downloads; the voice stack dominates their size.
strip = "symbols"
lto = "thin"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
